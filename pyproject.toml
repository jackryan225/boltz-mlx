[project]
name = "boltz-mlx"
version = "0.1.0"
description = "Boltz-2 structure and binding-affinity prediction on Apple-silicon Macs (MLX)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jack Ryan"}]
requires-python = ">=3.11"
keywords = ["boltz", "boltz-2", "mlx", "apple-silicon", "protein-structure", "binding-affinity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["mlx>=0.32", "numpy"]

[project.optional-dependencies]
# featurization, CCD/RDKit handling and output writing reuse the upstream boltz package (predict + screen)
screen = ["boltz>=2.2", "rdkit", "pyyaml"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jackryan225/boltz-mlx"
Repository = "https://github.com/jackryan225/boltz-mlx"
Issues = "https://github.com/jackryan225/boltz-mlx/issues"
Documentation = "https://github.com/jackryan225/boltz-mlx/blob/main/docs/report.md"

[project.scripts]
boltz-mlx = "boltz_mlx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["boltz_mlx*"]

[tool.setuptools.package-data]
# fp16 parameter list of the mixed checkpoint (boltz_mlx/mixed.py); per-device tuned kernel configs (kernels.device_cfg);
# `boltz-mlx gui` pages + bundled Mol* 4.5.0
boltz_mlx = ["fp16_manifest.json", "nax3_cfg.json", "atom_cfg.json", "msa_cfg.json", "gui/static/*", "gui/static/css/*", "gui/static/js/*", "gui/static/vendor/molstar/*"]
